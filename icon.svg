<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Reihenklemme auf Hutschiene">
  <!--
    Favicon: dieselbe Reihenklemme wie apple-touch-icon.png, aber von
    Hand als Vektor gesetzt. Der Rasterentwurf zerfaellt bei 16 px;
    drei flache Formen ueberstehen das. Farben aus dem Entwurf gemessen:
    Blau #024bab, Orange #e1651b, Grund #edeff3.

    Der Grund folgt dem Systemthema — im Dunkeln der Gehaeusegrund der
    Seite (#10131a), damit das Symbol in der Leiste nicht als helle
    Kachel steht.
  -->
  <style>
    .bg   { fill: #edeff3; }
    .rail { fill: #9aa3ad; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #10131a; }
      .rail { fill: #55606e; }
    }
  </style>

  <rect class="bg" width="64" height="64" rx="12"/>

  <!-- Hutschiene: laeuft durch, damit die Silhouette bei 16 px traegt -->
  <rect class="rail" x="0" y="27" width="64" height="10"/>
  <rect class="bg"   x="7"  y="30" width="9" height="4" rx="2"/>
  <rect class="bg"   x="48" y="30" width="9" height="4" rx="2"/>

  <!-- Die Klemme: sitzt auf der Schiene, ueberragt sie oben und unten -->
  <path fill="#024bab" d="M24 12h6v3h4v-3h6a3 3 0 0 1 3 3v34a3 3 0 0 1-3 3h-6v-3h-4v3h-6a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z"/>

  <!-- Schraubenkopf: die einzige Farbe, die nicht Blau ist -->
  <rect fill="#e1651b" x="28" y="22" width="10" height="10" rx="1.5"/>
  <rect fill="#024bab" x="30" y="26.2" width="6" height="1.8" rx="0.9"/>
</svg>
