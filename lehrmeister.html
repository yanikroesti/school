<!DOCTYPE html>
<html lang="de-CH" data-l="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-de="Ausbildungsstand — Yanik Rösti" data-en="Training progress — Yanik Rösti">Ausbildungsstand — Yanik Rösti</title>
<meta name="description" content="Schulischer Ausbildungsstand von Yanik Rösti, Elektroinstallateur EFZ, ELI 25a, BZI Interlaken — für den Lehrbetrieb.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8eaee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/page.css">
<style>
/* ---- Bericht für den Lehrbetrieb ----
   Ruhiger als der Rest der Seite. Dieselbe Welt, aber ohne Countdown
   und ohne Betrieb: wer das hier liest, will in dreissig Sekunden
   wissen, ob es läuft — und danach die Zahlen dahinter.

   Grundsatz für die ganze Seite: was fehlt, wird nicht gezeigt.
   Keine Striche, keine leeren Kästen, kein «noch keine Daten».
   Ein Bericht mit Lücken sieht nachlässig aus; ein kürzerer Bericht
   nicht.                                                             */

.bkopf {
  border-bottom: 1px solid var(--line-2);
  padding-bottom: 1.1rem; margin-bottom: 1.6rem;
}
.bkopf .zeile {
  display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap;
}
.bkopf h1 { font-size: var(--t-2xl); }
.bkopf .beruf {
  font-size: var(--t-m); color: var(--ink-2); font-weight: 500;
}
.bkopf .stand {
  margin-left: auto; font-family: var(--f-data); font-size: var(--t-xs);
  color: var(--muted); white-space: nowrap;
}
.fakten {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 0.1rem 1.6rem; margin-top: 0.9rem;
}
.fakten div { font-size: var(--t-s); color: var(--ink-2); }
.fakten dt {
  font-family: var(--f-data); font-size: 0.625rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.fakten dd { margin: 0 0 0.55rem; font-size: var(--t-s); color: var(--ink); }

/* ---- Kennzahlen ---- */
.kpi {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
  border-top: 1px solid var(--line-2); border-left: 1px solid var(--line-2);
}
.kpi > div {
  border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  padding: 0.85rem 0.95rem; background: var(--plate);
  display: flex; flex-direction: column; gap: 0.15rem;
}
.kpi .titel {
  font-size: var(--t-xs); color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.625rem;
}
.kpi .wert {
  font-family: var(--f-data); font-size: var(--t-2xl); font-weight: 600;
  line-height: 1.05; font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 0.3rem;
}
.kpi .wert .einheit {
  font-size: var(--t-xs); font-weight: 500; color: var(--muted);
}
.kpi .unten { font-size: var(--t-xs); color: var(--ink-2); }
.kpi .pfeil { font-family: var(--f-data); font-weight: 600; }
.kpi .pfeil.hoch { color: var(--live-ink); }
.kpi .pfeil.runter { color: var(--warn-ink); }

/* Notenfarben. Zwei Werte je Bedeutung, weil Flächenfarben als
   Schrift auf getöntem Grund durchfallen. */
.n-gut  { color: var(--live-ink); }
.n-warn { color: var(--warn-ink); }
.n-weg  { color: var(--alert); }

/* ---- Verlauf ---- */
.verlauf { position: relative; }
.verlauf svg { display: block; width: 100%; height: auto; }
.vsteuer {
  display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;
  margin-bottom: 0.9rem;
}
.vsteuer .spacer { flex: 1; }
.reihe {
  display: inline-flex; align-items: center; gap: 0.35rem;
  border: 1px solid var(--line-2); background: var(--plate);
  border-radius: var(--r-s); padding: 0.35rem 0.6rem; cursor: pointer;
  font-size: var(--t-xs); font-weight: 600; color: var(--muted);
  min-height: 32px;
  transition: background 0.12s var(--ease), color 0.12s var(--ease);
}
.reihe i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); display: block; }
.reihe[aria-pressed="true"] { color: var(--ink); background: var(--plate-2); border-color: var(--rail); }
.reihe[aria-pressed="false"] i { opacity: 0.3; }

.ablesung {
  font-family: var(--f-data); font-size: var(--t-xs); color: var(--ink-2);
  min-height: 1.4em; margin-top: 0.5rem;
  font-variant-numeric: tabular-nums;
}
.ablesung b { color: var(--ink); }
.punkt { cursor: pointer; }
.punkt:focus-visible { outline: 2px solid var(--s-abt); outline-offset: 2px; }

/* ---- Tabelle ---- */
.tab { width: 100%; font-size: var(--t-s); }
.tab th, .tab td {
  border-bottom: 1px solid var(--line); padding: 0.5rem 0.6rem; text-align: right;
}
.tab th:first-child, .tab td:first-child { text-align: left; }
.tab thead th {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); border-bottom-color: var(--line-2);
  font-family: var(--f-data);
}
.tab td.zahl { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.tab tr.gruppe td { font-weight: 700; background: var(--plate-2); }
.tab tr.gruppe td:first-child { border-left: 3px solid var(--c, var(--rail)); }
.tab tr.unter td:first-child { padding-left: 1.5rem; color: var(--ink-2); }

/* ---- Einzelne Prüfungen ---- */
.pliste { display: grid; gap: 0.5rem; }
.pruef {
  border: 1px solid var(--line-2); border-radius: var(--r-s);
  background: var(--plate); overflow: hidden;
}
.pruef > summary {
  display: grid; grid-template-columns: 3px 1fr auto; align-items: center;
  gap: 0 0.8rem; padding: 0; cursor: pointer; list-style: none;
  min-height: 56px;
}
.pruef > summary::-webkit-details-marker { display: none; }
.pruef > summary:hover { background: var(--plate-2); }
.pruef .fuss { background: var(--c, var(--rail)); align-self: stretch; }
.pruef .mitte { padding: 0.6rem 0; min-width: 0; }
.pruef .mitte b { display: block; font-size: var(--t-b); font-weight: 600; }
.pruef .mitte span {
  display: block; font-size: var(--t-xs); color: var(--muted);
  font-family: var(--f-data);
}
.pruef .note {
  font-family: var(--f-data); font-size: var(--t-xl); font-weight: 600;
  padding-right: 0.95rem; font-variant-numeric: tabular-nums;
}
.pruef .pb {
  padding: 0.75rem 0.95rem 0.85rem 1.75rem;
  border-top: 1px solid var(--line); font-size: var(--t-s); color: var(--ink-2);
}
.pruef .themen { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.5rem; }
.pruef .themen span {
  font-size: var(--t-xs); border: 1px solid var(--line-2); border-radius: var(--r-s);
  padding: 0.1rem 0.4rem; color: var(--ink-2);
}
.balkenzeile {
  display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem;
  font-family: var(--f-data); font-size: var(--t-xs);
}
.balken2 {
  flex: 1; height: 6px; background: var(--line); border-radius: 2px; overflow: hidden;
}
.balken2 i { display: block; height: 100%; background: var(--c, var(--rail)); }

.fussnote {
  font-size: var(--t-xs); color: var(--muted); line-height: 1.55;
  border-top: 1px solid var(--line); padding-top: 0.9rem; margin-top: 2.2rem;
}

@media print {
  .topbar, .foot, .vsteuer, #drucken { display: none !important; }
  body { background: #fff; }
  .kpi > div, .pruef { background: #fff; }
  .pruef .pb { display: block !important; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.7em; color: #555; }
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div id="inhalt" hidden>

    <header class="bkopf">
      <div class="zeile">
        <h1>Yanik Rösti</h1>
        <span class="stand" id="stand"></span>
      </div>
      <p class="beruf" style="margin:.25rem 0 0">
        <span lang="de">Elektroinstallateur EFZ — schulischer Ausbildungsstand</span>
        <span lang="en">Electrical installer EFZ — school progress report</span>
      </p>
      <dl class="fakten" id="fakten"></dl>
    </header>

    <section class="sect" aria-labelledby="k-h" id="s-kpi">
      <div class="sect-h">
        <h2 id="k-h"><span lang="de">Auf einen Blick</span><span lang="en">At a glance</span></h2>
        <span class="spacer"></span>
        <button class="tinybtn" id="drucken">
          <span lang="de">Drucken / PDF</span><span lang="en">Print / PDF</span>
        </button>
      </div>
      <div class="kpi" id="kpi"></div>
    </section>

    <section class="sect" aria-labelledby="v-h" id="s-verlauf" hidden>
      <div class="sect-h">
        <h2 id="v-h"><span lang="de">Verlauf</span><span lang="en">Trend</span></h2>
        <span class="spacer"></span>
      </div>
      <div class="vsteuer" id="vsteuer"></div>
      <div class="verlauf" id="verlauf"></div>
      <p class="ablesung" id="ablesung"></p>
    </section>

    <section class="sect" aria-labelledby="z-h" id="s-zeugnis" hidden>
      <div class="sect-h">
        <h2 id="z-h"><span lang="de">Semesterzeugnisse</span><span lang="en">Semester reports</span></h2>
        <span class="spacer"></span>
      </div>
      <table class="tab" id="ztab"></table>
    </section>

    <section class="sect" aria-labelledby="p-h" id="s-pruef" hidden>
      <div class="sect-h">
        <h2 id="p-h"></h2>
        <span class="spacer"></span>
      </div>
      <div class="pliste" id="pliste"></div>
    </section>

    <p class="fussnote" id="fussnote"></p>
  </div>

  <div id="laedt" class="panel" style="margin:2rem 0">
    <div class="pb">
      <span lang="de">Daten werden geladen …</span><span lang="en">Loading …</span>
    </div>
  </div>
</main>

<div id="foot-host"></div>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/lehrmeister.js"></script>
</body>
</html>
